name: fayrly

x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AUTO_MIGRATE: "true"
  JWT_SECRET: ${JWT_SECRET:-fayrly-dev-jwt-secret-change-me-0123456789abcdef}
  JWT_ISSUER: ${JWT_ISSUER:-fayrly}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-fayrly-api}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-fayrly-dev-internal-key-change-me-0123456789}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fayrly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fayrly}
      POSTGRES_DB: fayrly_auth
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fayrly_auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    restart: unless-stopped
    environment:
      <<: *service-env
      AUTH_ADDR: ":8081"
      AUTH_DATABASE_URL: postgres://${POSTGRES_USER:-fayrly}:${POSTGRES_PASSWORD:-fayrly}@postgres:5432/fayrly_auth?sslmode=disable
      USER_SERVICE_URL: http://user:8082
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      MAIL_MODE: ${MAIL_MODE:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Fayrly <no-reply@fayrly.local>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@fayrly.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-FayrlyAdmin123!}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Owner}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  user:
    build:
      context: .
      args:
        SERVICE: user
    restart: unless-stopped
    environment:
      <<: *service-env
      USER_ADDR: ":8082"
      USER_DATABASE_URL: postgres://${POSTGRES_USER:-fayrly}:${POSTGRES_PASSWORD:-fayrly}@postgres:5432/fayrly_user?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  event:
    build:
      context: .
      args:
        SERVICE: event
    restart: unless-stopped
    environment:
      <<: *service-env
      EVENT_ADDR: ":8083"
      EVENT_DATABASE_URL: postgres://${POSTGRES_USER:-fayrly}:${POSTGRES_PASSWORD:-fayrly}@postgres:5432/fayrly_event?sslmode=disable
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_ENVIRONMENT: ${MIDTRANS_ENVIRONMENT:-sandbox}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  report:
    build:
      context: .
      args:
        SERVICE: report
    restart: unless-stopped
    environment:
      <<: *service-env
      REPORT_ADDR: ":8084"
      REPORT_DATABASE_URL: postgres://${POSTGRES_USER:-fayrly}:${POSTGRES_PASSWORD:-fayrly}@postgres:5432/fayrly_report?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_ADDR: ":8080"
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      EVENT_SERVICE_URL: http://event:8083
      REPORT_SERVICE_URL: http://report:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-10m}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      event:
        condition: service_started
      report:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
