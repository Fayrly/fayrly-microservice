name: fayrly-staging

x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=16m,mode=1777
  pids_limit: 128
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-service-env: &service-env
  LOG_LEVEL: info
  AUTO_MIGRATE: "true"
  JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET}
  JWT_ISSUER: fayrly-staging
  JWT_AUDIENCE: fayrly-staging-api
  ACCESS_TOKEN_TTL: 15m
  INTERNAL_API_KEY: ${STAGING_INTERNAL_API_KEY:?Set STAGING_INTERNAL_API_KEY}

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fayrly
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: fayrly_auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "pg_isready -U fayrly -d fayrly_auth"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    <<: *runtime
    build:
      context: .
      args:
        SERVICE: auth
    environment:
      <<: *service-env
      AUTH_ADDR: ":8081"
      AUTH_DATABASE_URL: postgres://fayrly:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres:5432/fayrly_auth?sslmode=disable
      USER_SERVICE_URL: http://user:8082
      FIREBASE_PROJECT_ID: ${STAGING_FIREBASE_PROJECT_ID:-}
      REFRESH_TOKEN_TTL: 720h
      MAIL_MODE: auto
      RESEND_API_KEY: ${STAGING_RESEND_API_KEY:-}
      MAIL_FROM: ${STAGING_MAIL_FROM:-}
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8081/readyz >/dev/null || exit 1"]

  user:
    <<: *runtime
    build:
      context: .
      args:
        SERVICE: user
    environment:
      <<: *service-env
      USER_ADDR: ":8082"
      USER_DATABASE_URL: postgres://fayrly:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres:5432/fayrly_user?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8082/readyz >/dev/null || exit 1"]

  event:
    <<: *runtime
    build:
      context: .
      args:
        SERVICE: event
    environment:
      <<: *service-env
      EVENT_ADDR: ":8083"
      EVENT_DATABASE_URL: postgres://fayrly:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres:5432/fayrly_event?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8083/readyz >/dev/null || exit 1"]

  report:
    <<: *runtime
    build:
      context: .
      args:
        SERVICE: report
    environment:
      <<: *service-env
      REPORT_ADDR: ":8084"
      REPORT_DATABASE_URL: postgres://fayrly:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres:5432/fayrly_report?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8084/readyz >/dev/null || exit 1"]

  gateway:
    <<: *runtime
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      LOG_LEVEL: info
      GATEWAY_ADDR: ":8080"
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://user:8082
      EVENT_SERVICE_URL: http://event:8083
      REPORT_SERVICE_URL: http://report:8084
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS:?Set explicit HTTPS staging frontend origins}
      CORS_MAX_AGE: 10m
      RATE_LIMIT_RPS: 20
      RATE_LIMIT_BURST: 40
    ports:
      - "127.0.0.1:${STAGING_GATEWAY_PORT:-18080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      event:
        condition: service_healthy
      report:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]

volumes:
  postgres-data:
